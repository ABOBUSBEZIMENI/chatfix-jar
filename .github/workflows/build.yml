name: Build ChatFix
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Unpack and pick latest Fabric versions
        run: |
          unzip -q ChatFix-source.zip
          cd ChatFix
          LOOM=$(curl -s https://maven.fabricmc.net/net/fabricmc/fabric-loom/maven-metadata.xml | grep -oP '(?<=<release>)[^<]+')
          LOADER=$(curl -s https://meta.fabricmc.net/v2/versions/loader | jq -r '[.[]|select(.stable)][0].version')
          API=$(curl -s -A chatfix-build 'https://api.modrinth.com/v2/project/fabric-api/version?game_versions=%5B%221.21.11%22%5D&loaders=%5B%22fabric%22%5D' | jq -r '.[0].version_number')
          echo "loom=$LOOM loader=$LOADER api=$API"
          sed -i "s/id 'fabric-loom' version '.*'/id 'fabric-loom' version '$LOOM'/" build.gradle
          sed -i "s/^loader_version=.*/loader_version=$LOADER/" gradle.properties
          sed -i "s/^fabric_version=.*/fabric_version=$API/" gradle.properties
      - name: Build
        run: gradle build
        working-directory: ChatFix
      - uses: actions/upload-artifact@v4
        with:
          name: ChatFix
          path: ChatFix/build/libs/ChatFix.jar
